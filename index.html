<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Jarvis</title>
  </head>
  <body>
    <div class="stage" id="stage" data-state="idle">
      <!-- Top bar — always visible. Drag region in the centre lets you move
           Jarvis between screens; left side has macOS-style traffic lights
           (close / minimise) plus a "next screen" button. -->
      <div class="topbar" id="topbar">
        <div class="traffic-lights">
          <button
            class="tl close"
            id="tl-close"
            aria-label="Quit Jarvis"
            title="Quit Jarvis"
          ></button>
          <button
            class="tl min"
            id="tl-min"
            aria-label="Minimise"
            title="Minimise"
          ></button>
          <button
            class="tl screen"
            id="tl-screen"
            aria-label="Move to next screen"
            title="Move to next screen"
          ></button>
        </div>
        <div class="topbar-drag" data-tauri-drag-region>JARVIS</div>
        <div class="topbar-spacer"></div>
      </div>

      <!-- Three.js depth-hologram canvas is created inside #hud by graph.ts.
           role="img" + aria-label tells screen readers it's decorative; without
           this, VoiceOver announces a meaningless canvas blob. -->
      <div id="hud" role="img" aria-label="Jarvis holographic portrait (decorative)"></div>

      <!-- Top center: live state. aria-live=polite + atomic ensures
           VoiceOver announces every state transition (idle→listening→thinking
           →speaking) without interrupting other speech. -->
      <div class="state-badge" role="status" aria-live="polite" aria-atomic="true">
        <span class="dot" aria-hidden="true"></span><span id="state-name">IDLE</span>
      </div>

      <!-- Top center, below state badge: live trace of agent tool calls.
           Populated by `appendTraceLine()` in panels.ts from `hud://trace`
           events. Each line auto-fades after ~3s. aria-live=off because
           every tool call would otherwise spam the screen reader — trace
           is visual chrome only. -->
      <div class="trace" id="trace" aria-live="off"></div>

      <!-- Top left: system identity (host, model, OS, uptime, power) -->
      <div class="panel info">
        <div class="label">// System · Primary unit</div>
        <div class="meta">
          <span class="k">Host</span><span class="v" id="sys-host">—</span>
          <span class="k">Model</span><span class="v" id="sys-model">—</span>
          <span class="k">OS</span><span class="v" id="sys-os">—</span>
          <span class="k">User</span><span class="v" id="sys-user">—</span>
          <span class="k">Uptime</span><span class="v" id="sys-uptime">—</span>
          <span class="k">Power</span><span class="v" id="sys-power">—</span>
        </div>
      </div>

      <!-- Top right: clock + environment (date, wifi, battery, front app) -->
      <div class="panel clock">
        <div class="label">// System time · LCL</div>
        <div class="time">
          <span id="clock-time">00:00:00</span
          ><span class="ms" id="clock-ms">.000</span>
        </div>
        <div class="meta">
          <span class="k">Date</span><span class="v" id="clock-date">—</span>
          <span class="k">WiFi</span><span class="v" id="env-wifi">—</span>
          <span class="k">Battery</span><span class="v" id="env-battery">—</span>
          <span class="k">Front app</span><span class="v" id="env-front">—</span>
        </div>
      </div>

      <!-- Bottom right: audio I/O + live spectrum bars -->
      <div class="panel spectrum">
        <div class="label">// Audio · I/O</div>
        <div class="row">
          <span class="hz"
            ><span id="hz-peak">0</span><span class="unit">Hz</span></span
          >
          <span class="db"><span id="hz-db">-48</span> dB</span>
        </div>
        <div class="bars" id="spectrum-bars"></div>
        <div class="scale">
          <span>80</span><span>250</span><span>500</span><span>1k</span
          ><span>2k</span><span>4k</span><span>8k</span><span>16k</span>
        </div>
        <div class="sub">
          <span id="audio-input">—</span> · <span id="audio-output">—</span>
        </div>
      </div>

      <!-- Bottom left: live system pulse (CPU, RAM, disk, net) -->
      <div class="panel signal">
        <div class="label">// System · Pulse</div>
        <div class="row">
          <span class="k">CPU</span><span class="v" id="pulse-cpu">—</span>
        </div>
        <div class="row">
          <span class="k">Memory</span><span class="v" id="pulse-mem">—</span>
        </div>
        <div class="row">
          <span class="k">Disk</span><span class="v" id="pulse-disk">—</span>
        </div>
        <div class="row">
          <span class="k">Net in</span><span class="v" id="pulse-net-in">—</span>
        </div>
        <div class="row">
          <span class="k">Net out</span
          ><span class="v" id="pulse-net-out">—</span>
        </div>
        <div class="row">
          <span class="k">Mic level</span><span class="v" id="pulse-mic">—</span>
        </div>
      </div>

      <!-- Bottom center: state switcher + fullscreen↔widget toggle.
           Clickable in widget mode (window is interactive) and in the browser
           preview. Inert in the fullscreen click-through overlay — use the
           ⌃⌥J global hotkey there. -->
      <div class="states" role="tablist" aria-label="Hologram state">
        <button data-state="idle" aria-current="true">Idle</button>
        <button data-state="listening">Listening</button>
        <button data-state="speaking">Speaking</button>
        <button data-state="thinking">Thinking</button>
        <span class="states-divider" aria-hidden="true"></span>
        <button
          id="mode-toggle"
          class="mode-toggle"
          aria-label="Collapse to widget"
          title="Toggle widget / fullscreen (⌃⌥J)"
        ><span id="mode-toggle-label">MIN</span></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
