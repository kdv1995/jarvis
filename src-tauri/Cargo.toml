[package]
name = "jarvis"
version = "0.1.0"
description = "Voice-driven Iron Man HUD that orchestrates Claude Code"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows linker quirk).
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# tauri-plugin-global-shortcut intentionally removed — wake/open is voice-only.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture and resampling.
cpal = "0.16"
rubato = "0.16"

# System telemetry for the HUD panels (CPU, RAM, disk, uptime, etc.).
# Battery, WiFi, model name are filled in via `pmset`, `system_profiler`,
# and `sysctl` shell-outs because sysinfo doesn't expose them on macOS.
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk", "network"] }

# Skills system — YAML-defined workflows that compose fast-path commands.
# serde_yaml is deprecated (April 2024) but still maintained for 0.9.x line;
# we may migrate to yaml-rust2 if upstream archives the repo.
serde_yaml = "0.9"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }

# ElevenLabs cloud STT + TTS (macOS `say` stays as the offline TTS fallback).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
dotenvy = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
